server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: product-service
            uri: http://localhost:8081
            predicates:
              - Path=/products/**

          - id: customer-service
            uri: http://localhost:8082
            predicates:
              - Path=/customers/**

          - id: order-service
            uri: http://localhost:8083
            predicates:
              - Path=/orders/**
